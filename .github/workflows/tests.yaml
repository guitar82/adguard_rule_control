name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            homeassistant: "homeassistant==2025.1.4"
          - python-version: "3.14"
            homeassistant: "homeassistant"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pytest-asyncio ruff "${{ matrix.homeassistant }}"
      - run: ruff check custom_components tests
      - run: pytest
